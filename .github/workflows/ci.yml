name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails when package-lock.json is out of step with package.json,
      # which is the behaviour we want in CI.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Build extension
        run: npm run build

      # Fails on a manifest that would not load in Chrome: a missing referenced
      # file, ES module syntax in a content script, or an unsafe CSP.
      - name: Validate extension package
        run: node scripts/validate-package.mjs

      # A capability matrix whose summary contradicts its own table reports a
      # status nobody verified, so the drift is a build failure.
      - name: Check capability matrix consistency
        run: npm run check:parity

      - name: Upload unpacked extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: dist/
          retention-days: 14

  e2e:
    name: End-to-end (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only worth the browser download once the cheap gates are green.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite loads the built extension, so dist/ must exist first.
      - name: Build extension
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # An empty E2E_CHROMIUM_PATH hands binary resolution to Playwright. The
      # fixture then asks for the "chromium" channel explicitly, because
      # Playwright's default for a headless launch is chrome-headless-shell,
      # which cannot load extensions at all — every test in this suite failed
      # that way once, timing out on a service worker that could never
      # register. Changing either half without the other reintroduces it.
      - name: Run end-to-end suite
        run: npm run test:e2e
        env:
          E2E_CHROMIUM_PATH: ''

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the job on a moderate-or-worse advisory in the dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # A credential committed to the repository is a release-blocking defect.
      - name: Scan for committed secrets
        run: node scripts/scan-secrets.mjs
