name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails when package-lock.json is out of step with package.json,
      # which is the behaviour we want in CI.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Build extension
        run: npm run build

      # Fails on a manifest that would not load in Chrome: a missing referenced
      # file, ES module syntax in a content script, or an unsafe CSP.
      - name: Validate extension package
        run: node scripts/validate-package.mjs

      - name: Upload unpacked extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: dist/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the job on a moderate-or-worse advisory in the dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # A credential committed to the repository is a release-blocking defect.
      - name: Scan for committed secrets
        run: node scripts/scan-secrets.mjs
